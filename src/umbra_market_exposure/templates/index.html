<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBRA — Market Exposure & Risk Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(22, 25, 41, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #f43f5e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 90%, rgba(244, 63, 94, 0.12) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🌑</div>
            <div>
                <div class="logo-title">UMBRA</div>
                <div class="logo-subtitle">Matrice d'Exposition aux Risques & Conformité</div>
            </div>
        </div>
        <div class="badge">RISK MATRIX ENGINE ONLINE</div>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">Score d'Exposition Globale</div>
            <div class="info-row"><span class="info-label">Entreprise (SIREN)</span><span class="info-val" id="uSiren">-</span></div>
            <div class="info-row"><span class="info-label">Score de Risque</span><span class="info-val" id="uScore" style="color:#fb7185;">-</span></div>
            <div class="info-row"><span class="info-label">Niveau de Risque</span><span class="info-val" id="uLevel">-</span></div>
            <div class="info-row"><span class="info-label">Filtre Sanctions</span><span class="info-val" id="uSanctions" style="color:#34d399;">-</span></div>
        </div>

        <div class="card">
            <div class="card-title">Répartition par Secteurs d'Activité</div>
            <div id="sectorsList">Chargement des secteurs...</div>
        </div>
    </div>

    <script>
        async function analyserExposition() {
            try {
                const response = await fetch('/api/v1/exposure?siren=383474814');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('uSiren').textContent = r.siren || '383474814';
                document.getElementById('uScore').textContent = `${(r.exposure_score * 100).toFixed(0)} / 100`;
                document.getElementById('uLevel').textContent = (r.risk_level || 'FAIBLE').toUpperCase();
                document.getElementById('uSanctions').textContent = (r.sanctions_check || 'CONFORME').toUpperCase();

                const list = document.getElementById('sectorsList');
                list.innerHTML = '';
                for (const [sec, val] of Object.entries(r.sectors_breakdown || {})) {
                    list.innerHTML += `
                        <div class="info-row">
                            <span class="info-label" style="text-transform:capitalize;">${sec}</span>
                            <span class="info-val">${(val * 100).toFixed(0)}%</span>
                        </div>
                    `;
                }

            } catch (err) {
                console.error("Erreur lors de l'analyse d'exposition Umbra.");
            }
        }

        window.onload = analyserExposition;
    </script>
</body>
</html>
